name: Build PressCost APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PressCost-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon + splash
        run: npx capacitor-assets generate --android

      - name: Patch Android theme
        run: python3 scripts/patch_android.py

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: PressCost-App/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PressCost-APK
          path: PressCost-App/android/app/build/outputs/apk/debug/app-debug.apk
